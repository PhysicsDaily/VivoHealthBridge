# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Increase daemon heap and optimize GC to prevent build stalls and GC thrashing
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Enable parallel execution across multi-core processors
org.gradle.parallel=true

# Enable task output caching across builds
org.gradle.caching=true

# Enable file system watching to avoid scanning directory trees
org.gradle.vfs.watch=true

# Android and Kotlin settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Incremental compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=true
