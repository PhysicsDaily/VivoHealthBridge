# Project-wide Gradle settings.

# ── Build speed ───────────────────────────────────────────────────────
# 2 GB was not enough headroom for Kotlin + KSP + Compose in one daemon, so
# every build spent time in GC. The build cache and configuration cache are
# what turn an incremental build from "re-run everything" into a few tasks.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ── Project settings ──────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build features this project does not use. Each one left on is a task that
# runs, and a generated source set Kotlin has to compile, for nothing.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
