name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        # No gradle-version here on purpose: the wrapper already pins 8.7, so
        # asking for a distribution as well downloaded Gradle twice per run.
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Test and build
        # One invocation: configuration, the daemon and the Kotlin compile
        # classpath are all shared instead of paid for twice.
        run: ./gradlew testDebugUnitTest assembleDebug --build-cache --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VivoHealthBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
